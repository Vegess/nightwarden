<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Nightwarden</title>
<meta name="description" content="Nightwarden: an AI on-call agent that watches Citebase and explains every decision it makes.">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="shell">
  <header class="top">
    <a class="brand" href="#live">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      <span>Nightwarden</span>
      <small>AI on-call for <span id="svc">citebase</span></small>
    </a>
    <nav role="tablist" aria-label="Sections">
      <button role="tab" data-tab="live" aria-selected="true">Live</button>
      <button role="tab" data-tab="incidents" aria-selected="false">Incidents</button>
      <button role="tab" data-tab="eval" aria-selected="false">Evaluation</button>
      <button role="tab" data-tab="how" aria-selected="false">How it works</button>
    </nav>
  </header>
  <main>
    <section id="live" role="tabpanel"></section>
    <section id="incidents" role="tabpanel" hidden></section>
    <section id="eval" role="tabpanel" hidden></section>
    <section id="how" role="tabpanel" hidden></section>
  </main>
  <footer>Read-only public view · log lines are redacted before storage · raw evidence is admin-only</footer>
</div>
<div id="tip" class="tip" role="status" hidden></div>
<script src="/static/app.js" defer></script>
</body>
</html>
