<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightwarden</title>
<meta name="description" content="Nightwarden: an AI on-call agent that watches Citebase and explains every decision it makes.">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div class="brand">Nightwarden<small>AI on-call for <span id="svc">citebase</span></small></div>
  <nav role="tablist">
    <button role="tab" data-tab="live" aria-selected="true">Live</button>
    <button role="tab" data-tab="incidents" aria-selected="false">Incidents</button>
    <button role="tab" data-tab="eval" aria-selected="false">Evaluation</button>
  </nav>
</header>
<main>
  <section id="live"></section>
  <section id="incidents" hidden></section>
  <section id="eval" hidden></section>
</main>
<footer>Read-only view. Log lines are redacted before storage.</footer>
<script src="/static/app.js" defer></script>
</body>
</html>
