name: Agent eval
# Runs the 60-case eval against the real model. Manual, because it spends API quota.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: "Variations per scenario"
        default: "5"
      pause:
        description: "Seconds between agent runs (free-tier rate limits)"
        default: "3"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run agent + baseline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m eval.run_eval --agent --reps ${{ inputs.reps }} --pause ${{ inputs.pause }}
      - name: Report
        run: python -m eval.report | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results.json
