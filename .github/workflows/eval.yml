name: Agent eval
# Runs the labelled eval against the real model. Manual, because it spends API quota.
# Groq's free tier caps tokens per day: if a run stops early, run it again with
# "resume" ticked to finish only the cases that have no agent decision yet.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: "Variations per scenario (5 = full 60-case eval)"
        default: "5"
      from_rep:
        description: "First variation to run the agent on (1 = held-out set only; 0 = all)"
        default: "1"
      pause:
        description: "Seconds between cases (free-tier rate limits)"
        default: "8"
      resume:
        description: "Continue from the last run's results (only run missing cases)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch the previous results
        if: ${{ inputs.resume }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow eval.yml --status success \
                   --json databaseId -q '.[0].databaseId')
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n eval-results -D "$RUNNER_TEMP/prev"
          cp "$RUNNER_TEMP/prev/results.json" eval/results.json
      - name: Run agent + baseline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: >
          python -m eval.run_eval --agent --reps ${{ inputs.reps }} --from-rep ${{ inputs.from_rep }} --pause ${{ inputs.pause }}
          ${{ inputs.resume && '--only-missing' || '' }}
      - name: Report
        if: always()
        run: python -m eval.report | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results.json
