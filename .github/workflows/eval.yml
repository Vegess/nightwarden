name: Agent eval
# Runs the labelled eval against the real model. Manual, because it spends API quota.
# Groq's free tier caps tokens per day. Every run resumes: cases already scored (in the committed
# eval/results-*.json, or the last run's artifact with "resume" ticked) are skipped, one run spends at
# most token_budget tokens across all orchestrators, and a daily-cap 429 stops it cleanly.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: "Variations per scenario (5 = full 60-case eval)"
        default: "5"
      from_rep:
        description: "First variation to run the agent on (1 = held-out set only; 0 = all)"
        default: "1"
      pause:
        description: "Seconds between cases (free-tier rate limits)"
        default: "8"
      model:
        description: "Groq model"
        default: "openai/gpt-oss-120b"
      orchestrators:
        description: "Orchestrators to run, space-separated (loop, langgraph)"
        default: "loop langgraph"
      token_budget:
        description: "Groq tokens one run may spend, all orchestrators together"
        default: "120000"
      label:
        description: "Name for this eval version (resume only continues runs with the same name)"
        default: "orch-compare"
      resume:
        description: "Start from the last run's artifact instead of the committed results"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch the previous results
        if: ${{ inputs.resume }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest successful run that produced results under the same label.
          for run_id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow eval.yml --status success \
                          --limit 20 --json databaseId -q '.[].databaseId'); do
            if gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n "eval-results-${{ inputs.label }}" \
                 -D "$RUNNER_TEMP/prev" 2>/dev/null; then
              cp "$RUNNER_TEMP"/prev/results*.json eval/
              echo "Resuming from run $run_id"; exit 0
            fi
          done
          echo "No earlier results labelled ${{ inputs.label }}; starting fresh"
      - name: Run agent + baseline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ inputs.model }}
        run: |
          status=0
          for o in ${{ inputs.orchestrators }}; do
            echo "::group::$o"
            python -m eval.run_eval --agent --orchestrator "$o" --out "eval/results-$o.json" --reps ${{ inputs.reps }} --from-rep ${{ inputs.from_rep }} \
              --pause ${{ inputs.pause }} --model "${{ inputs.model }}" --token-budget ${{ inputs.token_budget }} \
              --budget-file "$RUNNER_TEMP/spent" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Report
        if: always()
        run: |
          for o in ${{ inputs.orchestrators }}; do
            if [ -f "eval/results-$o.json" ]; then
              python -m eval.report --file "eval/results-$o.json" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          python -m eval.compare | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Results in the log (one JSON row per case)
        if: always()
        run: |
          for f in eval/results-loop.json eval/results-langgraph.json; do
            if [ -f "$f" ]; then python -c "import json,sys; d=json.load(open(sys.argv[1])); print('META', sys.argv[1], json.dumps({k: v for k, v in d.items() if k != 'cases'})); [print('ROW', sys.argv[1], json.dumps(r)) for r in d['cases'] if r.get('agent')]" "$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ inputs.label }}
          path: eval/results*.json
